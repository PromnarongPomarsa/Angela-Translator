<svg width="256" height="256" viewBox="0 0 256 256" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Translator app icon</title>
  <defs>
    <marker id="ico-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4A9EFF"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="#1A1A1A"/>

  <!-- Left speech bubble -->
  <rect x="22" y="38" width="98" height="72" rx="16" fill="#F5F4F0"/>
  <polygon points="38,110 22,132 58,110" fill="#F5F4F0"/>

  <!-- Right speech bubble -->
  <rect x="136" y="38" width="98" height="72" rx="16" fill="#F5F4F0"/>
  <polygon points="218,110 234,132 198,110" fill="#F5F4F0"/>

  <!-- Left bubble: "A" -->
  <text x="71" y="88" text-anchor="middle" fill="#1A1A1A"
        font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600">A</text>

  <!-- Right bubble: Thai "ก" -->
  <text x="185" y="88" text-anchor="middle" fill="#1A1A1A"
        font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600">ก</text>

  <!-- Curved arrow -->
  <path d="M 71 148 Q 128 178 185 148" fill="none" stroke="#4A9EFF"
        stroke-width="3" stroke-linecap="round" marker-end="url(#ico-arrow)"/>

  <!-- Blue accent dot -->
  <circle cx="214" cy="34" r="14" fill="#4A9EFF"/>
  <text x="214" y="40" text-anchor="middle" fill="white"
        font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">✦</text>

  <!-- Separator line -->
  <line x1="52" y1="202" x2="204" y2="202" stroke="#333333" stroke-width="0.8"/>

  <!-- Bottom label -->
  <text x="128" y="220" text-anchor="middle" fill="#888888"
        font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500"
        letter-spacing="3">TRANSLATE</text>
</svg>
